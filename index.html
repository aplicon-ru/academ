<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Академия iMiron — в разработке</title>
<meta name="description" content="Академия iMiron — обучение 1С-инженеров. Сайт в разработке." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500&family=Manrope:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #1E252D;
    --accent: #3ECFB0;
    --text: #F5F6F7;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    padding: 24px;
  }
  main { max-width: 480px; }
  .wordmark {
    font-family: 'Unbounded', sans-serif;
    font-weight: 500;
    font-size: clamp(1.8rem, 6vw, 2.6rem);
    color: var(--accent);
    letter-spacing: 0.01em;
    margin: 0 0 14px;
  }
  .status {
    font-size: 1.05rem;
    color: rgba(245,246,247,.72);
    margin: 0 0 22px;
  }
  a {
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
  }
  a:hover { opacity: .8; }
</style>
</head>
<body>
  <main>
    <div class="wordmark">Академия iMiron</div>
    <p class="status">Сайт в разработке</p>
    <a href="https://aplicon.ru">← aplicon.ru</a>
  </main>
</body>
</html>
